name: Release

# Publica @alex-roc/ai-office en npm cuando se publica una release en GitHub.
#
# Sin tokens: npm confía en ESTE workflow por OIDC (trusted publishing, configurado con
# `npm trust github @alex-roc/ai-office --file release.yml --repo alex-roc/ai-office`). Nadie
# guarda un NPM_TOKEN en los secretos ni hace falta un código de un solo uso, y cada versión sale
# con su procedencia firmada (provenance). Ver docs/PUBLISHING.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing exige npm ≥ 11.5.1.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build
      - run: pnpm verificar:paquete
      # La versión del paquete tiene que coincidir con la etiqueta de la release (v0.2.0 -> 0.2.0):
      # así no se publica por error una versión distinta de la anunciada.
      - name: Check version matches the release tag
        if: github.event_name == 'release'
        run: |
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "package.json dice $pkg y la release es $tag"; exit 1; }
      - run: npm publish --access public --provenance
        working-directory: packages/cli
